---
# Source: observability-config/templates/external-secret.yaml
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-minilab
  namespace: minilab-observability
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 2m0s
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: alertmanager-minilab
    template:
      type: Opaque
      data:
        alertmanager.yaml: |
          global:
            resolve_timeout: 5m
          route:
            receiver: pagerduty
            group_by: ['alertname', 'namespace']
            group_wait: 30s
            group_interval: 5m
            repeat_interval: 12h
          receivers:
          - name: pagerduty
            pagerduty_configs:
            - routing_key: {{ .routing_key }}
              send_resolved: true
          inhibit_rules:
          - source_matchers: ['severity = "critical"']
            target_matchers: ['severity =~ "warning|info"']
            equal: ['alertname', 'namespace']
          - source_matchers: ['severity = "warning"']
            target_matchers: ['severity = "info"']
            equal: ['alertname', 'namespace']
  data:
    - secretKey: routing_key
      remoteRef:
        key: secret/data/global/pagerduty-routing-key
        property: key
---
# Source: observability-config/templates/monitoring-stack.yaml
apiVersion: monitoring.rhobs/v1alpha1
kind: MonitoringStack
metadata:
  name: minilab
  namespace: minilab-observability
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  logLevel: info
  retention: "30d"
  alertmanagerConfig:
    disabled: false
  prometheusConfig:
    replicas: 1
    persistentVolumeClaim:
      storageClassName: lvms-loopback
      resources:
        requests:
          storage: 10Gi
  resourceSelector:
    matchLabels:
      app.kubernetes.io/part-of: minilab-observability
  namespaceSelector:
    matchLabels:
      monitoring.rhobs/stack: minilab
---
# Source: observability-config/templates/perses-dashboards.yaml
apiVersion: perses.dev/v1alpha2
kind: PersesDashboard
metadata:
  name: openshift-system-overview
  namespace: minilab-observability
  annotations:
    perses.dev/tags: "openshift,system"
    argocd.argoproj.io/sync-wave: "2"
spec:
  config:
    display:
      name: "OpenShift System Overview"
      description: "Health and capacity of OpenShift system workloads"
    variables:
    - kind: ListVariable
      spec:
        name: interval
        allowAllValue: false
        allowMultiple: false
        defaultValue: 5m
        plugin:
          kind: StaticListVariable
          spec:
            values:
            - label: 1m
              value: 1m
            - label: 5m
              value: 5m
            - label: 15m
              value: 15m
    panels:
      clusterCpu:
        kind: Panel
        spec:
          display:
            name: "Cluster CPU Utilization"
          plugin:
            kind: TimeSeriesChart
            spec: {}
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: 100 - (avg(rate(node_cpu_seconds_total{mode="idle"}[$interval])) * 100)
      clusterMemory:
        kind: Panel
        spec:
          display:
            name: "Cluster Memory Utilization"
          plugin:
            kind: TimeSeriesChart
            spec: {}
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: (1 - (sum(node_memory_MemAvailable_bytes) / sum(node_memory_MemTotal_bytes))) * 100
      clusterNetwork:
        kind: Panel
        spec:
          display:
            name: "Cluster Network I/O"
          plugin:
            kind: TimeSeriesChart
            spec: {}
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: sum(rate(node_network_receive_bytes_total[$interval])) by (instance)
      readyNodes:
        kind: Panel
        spec:
          display:
            name: "Ready Nodes"
          plugin:
            kind: StatChart
            spec: {}
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: count(kube_node_status_condition{condition="Ready",status="true"})
    layouts:
    - kind: Grid
      spec:
        display:
          title: "System Workloads"
          collapse:
            open: true
        items:
        - x: 0
          y: 0
          width: 12
          height: 6
          content:
            $ref: "#/spec/panels/clusterCpu"
        - x: 12
          y: 0
          width: 12
          height: 6
          content:
            $ref: "#/spec/panels/clusterMemory"
        - x: 0
          y: 6
          width: 12
          height: 6
          content:
            $ref: "#/spec/panels/clusterNetwork"
        - x: 12
          y: 6
          width: 12
          height: 6
          content:
            $ref: "#/spec/panels/readyNodes"
    duration: 1h
