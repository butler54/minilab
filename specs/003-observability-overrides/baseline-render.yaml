apiVersion: perses.dev/v1alpha2
kind: PersesDashboard
metadata:
  name: application-overview
  namespace: minilab-observability
  annotations:
    perses.dev/tags: "application,workloads"
    argocd.argoproj.io/sync-wave: "2"
spec:
  config:
    display:
      name: "Application Overview"
      description: "Health of application workloads deployed on the cluster"
    variables:
    - kind: ListVariable
      spec:
        name: namespace
        allowAllValue: true
        allowMultiple: false
        plugin:
          kind: PrometheusLabelValuesVariable
          spec:
            labelName: namespace
            metricName: container_cpu_usage_seconds_total
            matchers: []
        defaultValue: ""
    - kind: ListVariable
      spec:
        name: interval
        allowAllValue: false
        allowMultiple: false
        defaultValue: 5m
        plugin:
          kind: StaticListVariable
          spec:
            values:
            - label: 1m
              value: 1m
            - label: 5m
              value: 5m
            - label: 15m
              value: 15m
    panels:
      appCpu:
        kind: Panel
        spec:
          display:
            name: "CPU Usage by Namespace"
          plugin:
            kind: TimeSeriesChart
            spec: {}
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: sum(rate(container_cpu_usage_seconds_total{namespace=~"$namespace"}[$interval])) by (namespace)
      appMemory:
        kind: Panel
        spec:
          display:
            name: "Memory Usage by Namespace"
          plugin:
            kind: TimeSeriesChart
            spec: {}
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: sum(container_memory_working_set_bytes{namespace=~"$namespace"}) by (namespace)
      appRestarts:
        kind: Panel
        spec:
          display:
            name: "Container Restarts"
          plugin:
            kind: TimeSeriesChart
            spec: {}
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: sum(increase(kube_pod_container_status_restarts_total{namespace=~"$namespace"}[$interval])) by (namespace)
    layouts:
    - kind: Grid
      spec:
        display:
          title: "Application Workloads"
          collapse:
            open: true
        items:
        - x: 0
          y: 0
          width: 12
          height: 6
          content:
            $ref: "#/spec/panels/appCpu"
        - x: 12
          y: 0
          width: 12
          height: 6
          content:
            $ref: "#/spec/panels/appMemory"
        - x: 0
          y: 6
          width: 24
          height: 6
          content:
            $ref: "#/spec/panels/appRestarts"
    duration: 1h
