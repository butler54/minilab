clusterGroup:
  name: prod
  namespaces:
    minilab:
    vault:
    external-secrets:
    openshift-storage:
      operatorGroup: true
      targetNamespaces:
      - openshift-storage
  subscriptions:
    lvms-operator:
      name: lvms-operator
      namespace: openshift-storage
      # The clustergroup chart does not template Subscription fields; these
      # values are asserted against global.lvmsCompatibility by local tests.
      channel: stable-4.22
      csv: lvms-operator.v4.22.0
      installPlanApproval: Automatic
  applications:
    lvms-config:
      name: lvms-config
      namespace: openshift-storage
      project: default
      path: charts/lvms-config
      annotations:
        argocd.argoproj.io/sync-wave: "-10"
    vault:
      name: vault
      namespace: vault
      project: default
      chart: hashicorp-vault
      chartVersion: 0.1.*
      annotations:
        argocd.argoproj.io/sync-wave: "+10"
    secrets-operator:
      name: openshift-external-secrets
      namespace: external-secrets
      project: external-secrets
      chart: openshift-external-secrets
      chartVersion: 0.0.*
  projects:
  - default
  # Shared files are applied after chart defaults. A later extraValueFiles entry
  # explicitly selected by an operator takes precedence over this provider default.
  sharedValueFiles:
  - '/overrides/values-storage-{{ $.Values.global.storageProvider }}.yaml'
