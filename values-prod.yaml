clusterGroup:
  name: prod
  namespaces:
    minilab:
    vault:
    external-secrets:
    external-secrets-operator:
      operatorGroup: true
      targetNamespaces: []
    openshift-storage:
      labels:
        openshift.io/cluster-monitoring: "true"
      operatorGroup: true
      targetNamespaces:
      - openshift-storage
    openshift-cluster-observability-operator:
      operatorGroup: true
      targetNamespaces: []
    minilab-observability:
      labels:
        monitoring.rhobs/stack: minilab
    openshell:
      labels:
        monitoring.rhobs/stack: minilab
    agent-sandbox-system:
    cert-manager-operator:
      operatorGroup: true
      targetNamespaces: []
    cert-manager:
    zero-trust-workload-identity-manager:
      operatorGroup: true
      targetNamespaces: []
  subscriptions:
    lvms-operator:
      name: lvms-operator
      namespace: openshift-storage
      # The clustergroup chart does not template Subscription fields; these
      # values are asserted against global.lvmsCompatibility by local tests.
      channel: stable-4.22
      csv: lvms-operator.v4.22.0
      installPlanApproval: Automatic
    eso:
      name: openshift-external-secrets-operator
      namespace: external-secrets-operator
      channel: stable-v1
    cluster-observability-operator:
      name: cluster-observability-operator
      namespace: openshift-cluster-observability-operator
      channel: stable
      installPlanApproval: Automatic
    cert-manager-operator:
      name: openshift-cert-manager-operator
      namespace: cert-manager-operator
      channel: stable-v1
      installPlanApproval: Automatic
    ztwim:
      name: openshift-zero-trust-workload-identity-manager
      namespace: zero-trust-workload-identity-manager
      channel: stable-v1
      installPlanApproval: Automatic
  applications:
    lvms-config:
      name: lvms-config
      namespace: openshift-storage
      project: default
      path: charts/lvms-config
      annotations:
        argocd.argoproj.io/sync-wave: "-10"
    vault:
      name: vault
      namespace: vault
      project: default
      chart: hashicorp-vault
      chartVersion: 0.1.*
      annotations:
        argocd.argoproj.io/sync-wave: "+10"
    secrets-operator:
      name: openshift-external-secrets
      namespace: external-secrets
      project: external-secrets
      chart: openshift-external-secrets
      chartVersion: 0.0.*
    observability-config:
      name: observability-config
      namespace: minilab-observability
      project: default
      path: charts/observability-config
      annotations:
        argocd.argoproj.io/sync-wave: "+20"
    openshell-platform:
      name: openshell-platform
      namespace: openshell
      project: default
      path: charts/openshell-platform
      annotations:
        argocd.argoproj.io/sync-wave: "-3"
    agent-sandbox:
      name: agent-sandbox
      namespace: agent-sandbox-system
      project: default
      path: charts/agent-sandbox
      annotations:
        argocd.argoproj.io/sync-wave: "-5"
    cert-manager-config:
      name: cert-manager-config
      namespace: cert-manager
      project: default
      path: charts/cert-manager-config
      annotations:
        argocd.argoproj.io/sync-wave: "-6"
    ztwim-config:
      name: ztwim-config
      namespace: zero-trust-workload-identity-manager
      project: default
      path: charts/ztwim-config
      annotations:
        argocd.argoproj.io/sync-wave: "-4"
    openshell:
      name: openshell
      namespace: openshell
      project: default
      path: charts/openshell
      annotations:
        argocd.argoproj.io/sync-wave: "0"
    openshell-policy:
      name: openshell-policy
      namespace: openshell
      project: default
      path: charts/openshell-policy
      annotations:
        argocd.argoproj.io/sync-wave: "+1"
    openshell-demo:
      name: openshell-demo
      namespace: openshell
      project: default
      path: charts/openshell-demo
      annotations:
        argocd.argoproj.io/sync-wave: "+2"
  projects:
  - default
  - external-secrets
  # Shared files are applied after chart defaults. A later extraValueFiles entry
  # explicitly selected by an operator takes precedence over this provider default.
  sharedValueFiles:
  - '/overrides/values-storage-{{ $.Values.global.storageProvider }}.yaml'
  - '/overrides/values-observability.yaml'
  - '/overrides/values-openshell.yaml'
