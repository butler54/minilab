clusterGroup:
  name: prod
  namespaces:
    minilab:
    vault:
    external-secrets:
    external-secrets-operator:
      operatorGroup: true
      targetNamespaces: []
    openshift-storage:
      labels:
        openshift.io/cluster-monitoring: "true"
      operatorGroup: true
      targetNamespaces:
      - openshift-storage
    openshift-cluster-observability-operator:
      operatorGroup: true
      targetNamespaces: []
    minilab-observability:
      labels:
        monitoring.rhobs/stack: minilab
    openshell:
      labels:
        monitoring.rhobs/stack: minilab
    agent-sandbox-system:
    cert-manager-operator:
      operatorGroup: true
      targetNamespaces: []
    cert-manager:
    zero-trust-workload-identity-manager:
      operatorGroup: true
      targetNamespaces: []
  subscriptions:
    lvms-operator:
      name: lvms-operator
      namespace: openshift-storage
      # The clustergroup chart does not template Subscription fields; these
      # values are asserted against global.lvmsCompatibility by local tests.
      channel: stable-4.22
      csv: lvms-operator.v4.22.0
      installPlanApproval: Automatic
    eso:
      name: openshift-external-secrets-operator
      namespace: external-secrets-operator
      channel: stable-v1
    cluster-observability-operator:
      name: cluster-observability-operator
      namespace: openshift-cluster-observability-operator
      channel: stable
      installPlanApproval: Automatic
    cert-manager-operator:
      name: openshift-cert-manager-operator
      namespace: cert-manager-operator
      channel: stable-v1
      installPlanApproval: Automatic
    ztwim:
      name: openshift-zero-trust-workload-identity-manager
      namespace: zero-trust-workload-identity-manager
      channel: stable-v1
      installPlanApproval: Automatic
  applications:
    lvms-config:
      name: lvms-config
      namespace: openshift-storage
      project: default
      path: charts/lvms-config
      annotations:
        argocd.argoproj.io/sync-wave: "-10"
    vault:
      name: vault
      namespace: vault
      project: default
      chart: hashicorp-vault
      chartVersion: 0.1.*
      annotations:
        argocd.argoproj.io/sync-wave: "+10"
    secrets-operator:
      name: openshift-external-secrets
      namespace: external-secrets
      project: external-secrets
      chart: openshift-external-secrets
      chartVersion: 0.0.*
    observability-config:
      name: observability-config
      namespace: minilab-observability
      project: default
      path: charts/observability-config
      annotations:
        argocd.argoproj.io/sync-wave: "+20"
    openshell-platform:
      name: openshell-platform
      namespace: openshell
      project: default
      path: charts/openshell-platform
      annotations:
        argocd.argoproj.io/sync-wave: "-3"
    agent-sandbox:
      name: agent-sandbox
      namespace: agent-sandbox-system
      project: default
      # External git-sourced chart (specs/007 contract): upstream helm/ dir at tag.
      # src: https://github.com/kubernetes-sigs/agent-sandbox
      repoURL: https://github.com/kubernetes-sigs/agent-sandbox
      path: helm
      chartVersion: v1.0.3
      extraValueFiles:
      - '/overrides/values-agent-sandbox.yaml'
      annotations:
        argocd.argoproj.io/sync-wave: "-5"
    cert-manager-config:
      name: cert-manager-config
      namespace: cert-manager
      project: default
      path: charts/cert-manager-config
      annotations:
        argocd.argoproj.io/sync-wave: "-7"
    cert-manager:
      name: cert-manager
      namespace: cert-manager
      project: default
      # VP community chart (specs/007 contract): cert-manager operand config +
      # single `acme` ClusterIssuer (Cloudflare DNS-01). Operator subscription
      # stays in clustergroup `subscriptions:` below.
      # src: https://github.com/validatedpatterns/ocp-certmanager-chart
      chart: ocp-certmanager
      chartVersion: "0.2.0"
      extraValueFiles:
      - '/overrides/values-certmanager.yaml'
      annotations:
        argocd.argoproj.io/sync-wave: "-6"
    ztwim:
      name: ztwim
      namespace: zero-trust-workload-identity-manager
      project: default
      # VP community chart (specs/007 contract): SPIRE stack singleton CRs.
      # The operator subscription stays in clustergroup `subscriptions:` below.
      # src: https://github.com/validatedpatterns/ztwim-chart
      chart: ztwim
      chartVersion: "0.1.1"
      extraValueFiles:
      - '/overrides/values-ztwim.yaml'
      annotations:
        argocd.argoproj.io/sync-wave: "-4"
    openshell-extras:
      name: openshell-extras
      namespace: openshell
      project: default
      path: charts/openshell-extras
      annotations:
        argocd.argoproj.io/sync-wave: "-1"
    openshell:
      name: openshell
      namespace: openshell
      project: default
      # External OCI chart (specs/007 contract): NVIDIA OpenShell, pinned.
      # src: https://github.com/NVIDIA/OpenShell (oci://ghcr.io/nvidia/openshell/helm-chart)
      repoURL: ghcr.io/nvidia/openshell
      chart: helm-chart
      chartVersion: "0.0.116"
      extraValueFiles:
      - '/overrides/values-openshell-gateway.yaml'
      annotations:
        argocd.argoproj.io/sync-wave: "0"
    openshell-policy:
      name: openshell-policy
      namespace: openshell
      project: default
      path: charts/openshell-policy
      annotations:
        argocd.argoproj.io/sync-wave: "+1"
    openshell-demo:
      name: openshell-demo
      namespace: openshell
      project: default
      path: charts/openshell-demo
      annotations:
        argocd.argoproj.io/sync-wave: "+2"
  projects:
  - default
  - external-secrets
  # Shared files are applied after chart defaults. A later extraValueFiles entry
  # explicitly selected by an operator takes precedence over this provider default.
  sharedValueFiles:
  - '/overrides/values-storage-{{ $.Values.global.storageProvider }}.yaml'
  - '/overrides/values-observability.yaml'
  - '/overrides/values-openshell.yaml'
