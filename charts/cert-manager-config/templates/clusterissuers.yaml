{{- if .Values.global.openshell.enabled }}
# Two issuers per research.md D6: staging is used for all bring-up (LE prod
# limits duplicate SAN sets to 5/7 days); openshell.issuer flips the gateway
# to prod only after staging issuance is proven in the testing phase.
{{- range $env := list "staging" "prod" }}
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-{{ $env }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  acme:
    email: {{ $.Values.global.acmeEmail }}
    server: {{ ternary "https://acme-v02.api.letsencrypt.org/directory" "https://acme-staging-v02.api.letsencrypt.org/directory" (eq $env "prod") }}
    privateKeySecretRef:
      name: letsencrypt-{{ $env }}-account-key
    solvers:
    - dns01:
        cloudflare:
          apiTokenSecretRef:
            name: cloudflare-api-token
            key: api-token
      selector:
        dnsZones:
        - {{ $.Values.global.dnsZone }}
{{- end }}
{{- end }}
