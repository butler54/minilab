{{- if .Values.global.openshell.enabled }}
# Minimal RBAC for the OIDC CA fetch job: write its own ConfigMap in its own
# namespace and nothing else (the endpoint probe itself is unprivileged).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openshell-oidc-ca-fetch
  namespace: openshell
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: openshell-oidc-ca-writer
  namespace: openshell
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "create", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openshell-oidc-ca-fetch
  namespace: openshell
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: openshell-oidc-ca-writer
subjects:
- kind: ServiceAccount
  name: openshell-oidc-ca-fetch
  namespace: openshell
{{- end }}
