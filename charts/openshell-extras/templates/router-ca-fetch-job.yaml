{{- if .Values.global.openshell.enabled }}
# One-shot job: copy router-ca's bundle into the openshell namespace as the
# ConfigMap server.oidc.caConfigMapName points at. Idempotent (oc apply); runs
# before the gateway workload via sync wave. Router CA rotation is the
# documented manual re-trigger (delete the job, resync).
apiVersion: batch/v1
kind: Job
metadata:
  name: openshell-oidc-ca-fetch
  namespace: openshift-config-managed
  annotations:
    # Argo GitOps hook: the job is re-created (BeforeHookCreation) on each sync,
    # dodging batch/Job pod-spec immutability on image changes, and the app no
    # longer health-blocks waiting for a one-shot batch Job.
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 4
  template:
    spec:
      serviceAccountName: openshell-router-ca-pull
      restartPolicy: Never
      containers:
      - name: fetch
        # Digested OCP 4.22.13 release cli (registry.redhat.io removed :latest;
        # keep in sync with values-global.yaml lvmsCompatibility.cliImage)
        image: quay.io/openshift-release-dev/ocp-v4.0-art-dev@sha256:84b0aa6c19cdedba485212a5b599bdb9fd6975d5c808aaf4f115500b782ee600
        command:
        - /bin/bash
        - -ec
        - |
          bundle=$(oc get configmap router-ca -n openshift-config-managed -o jsonpath='{.data.ca-bundle\.crt}')
          [ -n "$bundle" ] || { echo "router-ca cm empty"; exit 1; }
          oc create configmap openshell-oidc-ca -n openshell \
            --from-literal=ca.crt="$bundle" \
            --dry-run=client -o yaml | oc apply -f -
          echo "openshell-oidc-ca synced"
{{- end }}
