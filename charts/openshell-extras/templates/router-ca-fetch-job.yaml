{{- if .Values.global.openshell.enabled }}
# One-shot job: capture the OAuth route's serving CA chain by probing the
# public OAuth endpoint and write it as ConfigMap server.oidc.caConfigMapName.
#
# Why probe the endpoint instead of reading openshift-config-managed/router-ca:
# (1) openshift-config-managed is CVO-owned with a default-deny-all NetworkPolicy
#     (pods there cannot reach the API server);
# (2) the OpenShift ingress operator does not reliably publish router-ca on
#     every cluster build (absent here);
# (3) the serving chain is public TLS material — no privileged reads needed
#     (least-privilege by elimination: no RBAC at all).
# Re-trigger manually after router CA rotation: delete the job + resync.
apiVersion: batch/v1
kind: Job
metadata:
  name: openshell-oidc-ca-fetch
  namespace: openshell
  annotations:
    # Argo GitOps hook: re-created (BeforeHookCreation) on each sync, dodging
    # batch/Job pod-spec immutability; app health does not block on one-shots.
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 4
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: fetch
        # Digested OCP 4.22.13 release cli (registry.redhat.io removed :latest;
        # keep in sync with values-global.yaml lvmsCompatibility.cliImage)
        image: quay.io/openshift-release-dev/ocp-v4.0-art-dev@sha256:84b0aa6c19cdedba485212a5b599bdb9fd6975d5c808aaf4f115500b782ee600
        command:
        - /bin/bash
        - -ec
        - |
          host={{ printf "oauth-openshift.%s" $.Values.global.localClusterDomain | quote }}
          echo | openssl s_client -connect "${host}:443" -servername "$host" -showcerts 2>/dev/null \
            | awk '/BEGIN CERTIFICATE/,/END CERTIFICATE/{print; if (/END CERTIFICATE/) exit}' > /tmp/ca.crt
          openssl x509 -in /tmp/ca.crt -noout -subject || { echo "no cert chain captured"; exit 1; }
          oc create configmap openshell-oidc-ca -n openshell \
            --from-file=ca.crt=/tmp/ca.crt \
            --dry-run=client -o yaml | oc apply --server-side -f -
          echo "openshell-oidc-ca synced from ${host}"
{{- end }}
