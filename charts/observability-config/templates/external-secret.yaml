{{- if .Values.global.observability.enabled }}
{{- $obs := .Values.global.observability }}
{{- $pd := .Values.pagerduty }}
{{- $am := .Values.alertmanager }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $am.configSecretName }}
  namespace: {{ $obs.stackNamespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: {{ $pd.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.secretStore.name }}
    kind: {{ .Values.secretStore.kind }}
  target:
    name: {{ $am.configSecretName }}
    template:
      type: Opaque
      data:
        alertmanager.yaml: |
          global:
            resolve_timeout: 5m
          route:
            receiver: pagerduty
            group_by: ['alertname', 'namespace']
            group_wait: 30s
            group_interval: 5m
            repeat_interval: 12h
          receivers:
          - name: pagerduty
            pagerduty_configs:
            - routing_key: {{ `{{ .routing_key }}` }}
              send_resolved: true
          inhibit_rules:
          - source_matchers: ['severity = "critical"']
            target_matchers: ['severity =~ "warning|info"']
            equal: ['alertname', 'namespace']
          - source_matchers: ['severity = "warning"']
            target_matchers: ['severity = "info"']
            equal: ['alertname', 'namespace']
  data:
    - secretKey: routing_key
      remoteRef:
        key: {{ $pd.remoteKey }}
        property: key
{{- end }}