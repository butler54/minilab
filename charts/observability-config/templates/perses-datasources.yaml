{{- if .Values.global.observability.enabled }}
{{- $obs := .Values.global.observability }}
{{- $ds := .Values.datasources }}
{{- $stack := .Values.monitoringStack }}
# COO provides the authenticated platform Thanos datasource in its own project.
# Keep only the pattern-local datasource here; external dashboards use it by name.
apiVersion: perses.dev/v1alpha2
kind: PersesDatasource
metadata:
  name: {{ $ds.external.name }}
  namespace: {{ $obs.stackNamespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  config:
    display:
      name: "Minilab Stack Prometheus"
    default: false
    plugin:
      kind: PrometheusDatasource
      spec:
        proxy:
          kind: HTTPProxy
          spec:
            url: "http://{{ $stack.name }}-prometheus.{{ $obs.stackNamespace }}.svc.cluster.local:9090"
{{- end }}
