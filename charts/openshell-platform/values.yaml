global:
  openshell:
    enabled: false
    # Hermetic default so the chart self-renders without nil-pointer when the
    # operator dials are not supplied (refactor 007, T026).
    ztwim:
      enabled: false
    sandbox:
      maxConcurrent: 3

# Pattern secret store (mirrors charts/observability-config).
secretStore:
  name: vault-backend
  kind: ClusterSecretStore

kek:
  # Vault path holding the gateway credential-storage KEK (research.md D4).
  remoteKey: secret/data/hub/openshell-gateway-kek
  field: kek
  refreshInterval: 5m0s
  secretName: openshell-kek
