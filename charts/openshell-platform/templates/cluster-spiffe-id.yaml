{{- if and .Values.global.openshell.enabled .Values.global.openshell.ztwim.enabled }}
# Workload registration for OpenShell sandbox pods (research D8/F1): gateway
# exchanges the sandbox's JWT-SVID for a short-lived OpenAI access token, so
# the provider key never enters the sandbox.
apiVersion: spire.spiffe.io/v1alpha1
kind: ClusterSPIFFEID
metadata:
  name: openshell-sandbox-workloads
  annotations:
    argocd.argoproj.io/sync-wave: "+3"
spec:
  # Selector shape: this operator's CRD (v1alpha1) has NO workloadSelector.k8sServiceAccount
  # field — schema exposes workloadSelectorTemplates (string list); unknown
  # fields are silently pruned (found live 2026-09-26).
  workloadSelectorTemplates:
  - k8s:sa:openshell-sandbox
  - k8s:ns:openshell
  spiffeIDTemplate: /openshell/sandbox
  # ttl is a duration STRING in this operator's CRD (API errors on integer:
  # "must be of type string"). Sample YAMLs show plain 3600 but the API requires
  # the unit-suffixed form.
  ttl: "3600s"
{{- end }}
