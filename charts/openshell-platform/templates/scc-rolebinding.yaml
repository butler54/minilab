{{- if .Values.global.openshell.enabled }}
# Declarative replacement for `oc adm policy add-scc-to-user privileged
# -z openshell-sandbox -n openshell` (spec FR-004).
# Sandbox pods under this service account run privileged per upstream
# OpenShift requirements; the trade-off is documented in the spec.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openshell-sandbox-privileged
  namespace: openshell
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:privileged
subjects:
- kind: ServiceAccount
  name: openshell-sandbox
  namespace: openshell
{{- end }}
