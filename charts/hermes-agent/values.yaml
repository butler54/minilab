# Defaults mirror overrides/values-openshell.yaml (global.openshell.hermes);
# the override file is the operator-facing dial surface.
global:
  openshell:
    enabled: false
    hermes:
      enabled: false
      slack:
        # Flip when the Slack workspace + app exist and the tokens are seeded
        # in vault at secret/data/hub/openshell-slack (bot-token, app-token).
        enabled: false
      signal:
        # E.164 number of the linked Signal device (SIGNAL_ACCOUNT; blank =
        # Signal disabled until the QR-linking spike runs).
        account: ""
        allowedUsers: "+61408390624"

secretStore:
  name: vault-backend
  kind: ClusterSecretStore

hermes:
  sandboxName: hermes
  # Own registry (containers repo, hermes layer). Digest-pinned from the
  # first publish (PR #64 merge, 2026-11-16; recorded in docs/hermes-agent.md).
  image: ghcr.io/butler54/openshell-sandbox-hermes@sha256:a8c6f65ecda8f81063a71872b2bf2e026bd7021438d3971096cf29b6b99daa2c
  slack:
    remoteKey: secret/data/hub/openshell-slack
    secretName: hermes-slack-tokens
    refreshInterval: 5m0s
