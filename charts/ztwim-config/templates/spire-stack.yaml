{{- if and .Values.global.openshell.enabled .Values.global.openshell.ztwim.enabled }}
{{- $trustDomain := .Values.global.openshell.trustDomain | default .Values.global.dnsZone }}
# Singleton `cluster` CRs per research.md D7. trustDomain/clusterName are
# effectively immutable after creation (see contracts/ztwim-assessment.md).
apiVersion: operator.openshift.io/v1alpha1
kind: ZeroTrustWorkloadIdentityManager
metadata:
  name: cluster
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  trustDomain: {{ $trustDomain | quote }}
  clusterName: minilab-prod
  bundleConfigMap: spire-bundle
---
# Fields verified against operator API types
# (github.com/openshift/zero-trust-workload-identity-manager api/v1alpha1,
# spire_server_config_types.go). trustDomain/clusterName live ONLY on the
# ZeroTrustWorkloadIdentityManager CR above — setting them here would be pruned.
apiVersion: operator.openshift.io/v1alpha1
kind: SpireServer
metadata:
  name: cluster
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  logLevel: info
  logFormat: text
  # jwtIssuer is REQUIRED (schema: https? URL). No OIDC discovery provider is
  # deployed, so this host is a declarative identifier only; if a discovery
  # provider is added later, align this with its Route host.
  jwtIssuer: {{ printf "https://oidc.%s" $trustDomain | quote }}
  caKeyType: rsa-2048
  caSubject:
    commonName: "minilab SPIRE CA"
    organization: minilab
    country: AU
  caValidity: 24h
  defaultX509Validity: 1h
  defaultJWTValidity: 5m
  datastore:
    databaseType: sqlite3
    # Default connection string per schema; declared explicitly for GitOps clarity.
    connectionString: /run/spire/data/datastore.sqlite3
  persistence:
    size: {{ .Values.spireServer.persistenceSize }}
    accessMode: ReadWriteOnce
    # empty storageClass = cluster default (LVMS per values-global.yaml)
    storageClass: ""
  resources: {{- toYaml .Values.spireServer.resources | nindent 4 }}
---
apiVersion: operator.openshift.io/v1alpha1
kind: SpireAgent
metadata:
  name: cluster
  annotations:
    argocd.argoproj.io/sync-wave: "+1"
spec:
  logLevel: info
  logFormat: text
  nodeAttestor:
    k8sPSATEnabled: "true"
  workloadAttestors:
    k8sEnabled: "true"
    workloadAttestorsVerification:
      type: auto
  resources: {{- toYaml .Values.spireAgent.resources | nindent 4 }}
---
apiVersion: operator.openshift.io/v1alpha1
kind: SpiffeCSIDriver
metadata:
  name: cluster
  annotations:
    argocd.argoproj.io/sync-wave: "+2"
spec:
  agentSocketPath: /run/spire/agent-sockets
  pluginName: csi.spiffe.io
  resources: {{- toYaml .Values.spiffeCsiDriver.resources | nindent 4 }}
{{- end }}
