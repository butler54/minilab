global:
  openshell:
    enabled: false

# Static pins for the vendored upstream OpenShell chart (research.md D4/D10).
# Operator-dials (hostname, issuer, OIDC endpoints) live in
# overrides/values-openshell.yaml — same file as the global.* feature values —
# and are drift-checked by tests/test-openshell-values.sh.
openshell:
  replicaCount: 1
  image:
    tag: "0.0.116"
  supervisor:
    image:
      tag: "0.0.116"
    sideloadMethod: init-container
    topology: combined
  server:
    telemetryEnabled: false
    appArmorProfile: Unconfined
    disableTls: false
    # NOTE: server.providerTokenGrants.spiffe.* is an OPERATOR DIAL and lives in
    # overrides/values-openshell.yaml (it must track global.openshell.ztwim.enabled).
    # Upstream default floats on :latest (violates FR-005) — pinned to the
    # digest of ghcr.io/nvidia/openshell-community/sandboxes/base:latest as of
    # 2026-09-23 (chart 0.0.116 era). Refresh per charts/openshell/README.md
    # update procedure; compatibility with run sandboxes is verified in the
    # testing phase (V-EGRESS smoke sandbox).
    sandboxImage: ghcr.io/nvidia/openshell-community/sandboxes/base@sha256:aeef1c63f00e2913ea002ccb3aaf925f338b5c5d70e63576f0d95c16a138044e
    credentialStorage:
      existingSecret: openshell-kek
  agentSandbox:
    preflight:
      enabled: false
  podSecurityContext:
    fsGroup: null
  securityContext:
    runAsUser: null
  openshiftRoute:
    enabled: false
  certManager:
    enabled: false
