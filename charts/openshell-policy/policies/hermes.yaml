# HERMES AGENT POLICY — least-privilege egress for the Hermes messaging
# agent sandbox (docs/hermes-agent.md; containers repo 007-hermes-sandbox-layer).
#
# Channels: self-hosted qwen inference (donnager-linux, direct LAN IP — no
# tailscale from the cluster), Slack (socket mode), Signal (signal-cli).
#
# Binary paths are the kernel-resolved executables that open the connections
# (verified live in S1, docs/hermes-agent.md). NOTE: the hermes launcher is a
# `#!/usr/bin/env python3` script that RE-EXECS itself with its bundled tools
# python (verified live: the launcher's runpy re-launch runs under
# /opt/hermes/tools/python-<ver>/bin/python3.14, and THAT interpreter opens
# the model/Slack sockets); the sandbox runtime also injects its own venv
# (/sandbox/.venv -> /sandbox/.uv/python/<ver>/...). Globs keep the rules
# valid across version bumps (paths must be kernel-resolved; globs are
# allowed by the schema). The Temurin JRE runs signal-cli (Signal egress).
# Verified S1: hermes --version works; connections hang (fail-closed) if the
# tools-python glob is missing from the binaries list.
#
# Loopback (hermes -> signal-cli daemon on 127.0.0.1:8080) is not mediated by
# policy: OpenShell policy never authorizes loopback (schema: sandbox-local
# traffic stays inside the sandbox).
#
# Justification trail: measured live in Gate 0 (docs/hermes-agent.md) —
# GET/POST to the qwen endpoint verified from a probe sandbox under exactly
# this endpoint shape; Slack hosts mirror NemoClaw's maintained slack preset
# (src/lib/messaging/channels/slack/policy/hermes.yaml); Signal hosts are the
# signal-cli LiveConfig service set, raw-TLS passthrough because libsignal
# validates against its own pinned trust store (whisper.store) and cannot
# tolerate L7 TLS re-origination (same class as NemoClaw's WhatsApp preset).
version: 1
filesystem_policy:
  include_workdir: true
  read_only:
  - /usr
  - /lib
  - /etc
  - /var/log
  - /proc
  - /dev/urandom
  # Hermes layer layout (containers 007): the hermes checkout, venv, tools,
  # signal-cli and the Temurin JRE all live under /opt — image-owned,
  # read-only at runtime.
  - /opt
  read_write:
  - /tmp
  - /dev/null
network_policies:
  # justification: GATE0-1 — hermes inference via donnager-linux Ollama
  # (OpenAI-compatible /v1; GET /v1/models + POST /v1/chat/completions
  # verified from a probe sandbox 2026-11-16). Direct IP: the cluster has no
  # tailscale route to donnager-linux. Plain IPv4 — OpenShell 0.1.8 evaluates
  # IPv4-mapped IPv6 as plain IPv4 (upstream PR #5101).
  allow_donnager_qwen:
    name: allow_donnager_qwen
    endpoints:
    - host: 192.168.4.190
      port: 11434
      protocol: rest
      access: read-write
      enforcement: enforce
    binaries:
    - path: /opt/hermes/tools/python-*/bin/python3*
    - path: /sandbox/.uv/python/*/bin/python3*
  # justification: Slack socket mode — wss-primary/wss-backup are the hosts
  # Slack's apps.connections.open hands back for the long-lived gateway
  # WebSocket; slack.com/api.slack.com carry the Web API; hooks.slack.com
  # covers webhook delivery. Mirrors NemoClaw's maintained preset.
  allow_slack:
    name: allow_slack
    endpoints:
    - host: slack.com
      port: 443
      protocol: rest
      access: full
      enforcement: enforce
    - host: api.slack.com
      port: 443
      protocol: rest
      access: full
      enforcement: enforce
    - host: hooks.slack.com
      port: 443
      protocol: rest
      access: full
      enforcement: enforce
    - host: wss-primary.slack.com
      port: 443
      protocol: websocket
      access: full
      enforcement: enforce
    - host: wss-backup.slack.com
      port: 443
      protocol: websocket
      access: full
      enforcement: enforce
    binaries:
    - path: /opt/hermes/tools/python-*/bin/python3*
    - path: /sandbox/.uv/python/*/bin/python3*
  # justification: hermes live model-catalog + plugin-catalog fetch. These
  # hosts were deliberately DENIED through S4 (INFO-level, non-fatal — hermes
  # falls back to the shipped catalog; recorded in docs/hermes-agent.md);
  # allowed per operator decision 2026-11-20. Plain HTTPS from the tools
  # python against the system trust store — no pinned-CA passthrough needed
  # (unlike Signal), so protocol: rest with L7 enforcement; no tls:skip.
  allow_hermes_catalog:
    name: allow_hermes_catalog
    endpoints:
    - host: hermes-agent.nousresearch.com
      port: 443
      protocol: rest
      access: read-only
      enforcement: enforce
    - host: raw.githubusercontent.com
      port: 443
      protocol: rest
      access: read-only
      enforcement: enforce
    binaries:
    - path: /opt/hermes/tools/python-*/bin/python3*
    - path: /sandbox/.uv/python/*/bin/python3*
  # justification: Signal via signal-cli — service endpoints from signal-cli's
  # LiveConfig (chat/CDN/storage/CDSI/SVR2). Raw TLS passthrough (tls: skip,
  # no request protocol): libsignal pins its own trust store, so the L7 proxy
  # cannot re-originate TLS. Scoped to the JRE binary only. NOTE: this
  # forfeits L7 inspection of Signal traffic — accepted tradeoff recorded in
  # docs/hermes-agent.md (security posture).
  allow_signal:
    name: allow_signal
    endpoints:
    - host: chat.signal.org
      port: 443
      protocol: tcp
      tls: skip
    - host: cdn.signal.org
      port: 443
      protocol: tcp
      tls: skip
    - host: cdn2.signal.org
      port: 443
      protocol: tcp
      tls: skip
    - host: cdn3.signal.org
      port: 443
      protocol: tcp
      tls: skip
    - host: storage.signal.org
      port: 443
      protocol: tcp
      tls: skip
    - host: cdsi.signal.org
      port: 443
      protocol: tcp
      tls: skip
    - host: svr2.signal.org
      port: 443
      protocol: tcp
      tls: skip
    binaries:
    - path: /opt/java/jre25/bin/java
