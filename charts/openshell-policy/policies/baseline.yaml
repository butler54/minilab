# Baseline policy for all sandboxes.
#
# OpenShell sandboxes are deny-all-egress by default; this baseline documents
# that posture explicitly. Apply with:
#   openshell policy set <sandbox> --policy <this-file> --wait
#
# Schema validated LIVE against OpenShell 0.1.1 (V-EGRESS, 2026-09-27):
# network_policies is the egress map; the supervisor OPA requires binary
# identity, so EVERY rule must list `binaries` (kernel-resolved /proc/<pid>/exe
# paths, not symlinks) or the rule silently denies everything.
version: 1
filesystem_policy:
  include_workdir: true
  read_only:
  - /usr
  - /lib
  - /etc
  - /var/log
  - /proc
  - /dev/urandom
  read_write:
  - /tmp
  - /dev/null
network_policies: {}
