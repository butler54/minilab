{{- $storage := required "global.localStorage is required" .Values.global.localStorage }}
apiVersion: lvm.topolvm.io/v1alpha1
kind: LVMCluster
metadata:
  name: {{ .Values.lvmCluster.name }}
  namespace: openshift-storage
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  tolerations:
{{- toYaml .Values.lvmCluster.tolerations | nindent 4 }}
  storage:
    deviceClasses:
    - name: loopback
      deviceSelector:
        paths:
        - {{ $storage.loopDevice }}
      nodeSelector:
        nodeSelectorTerms:
        - matchExpressions:
{{- range $key, $value := .Values.lvmCluster.nodeSelector }}
          - key: {{ $key }}
            operator: In
            values: [{{ $value | quote }}]
{{- end }}
      storageClassOptions:
        volumeBindingMode: WaitForFirstConsumer
        reclaimPolicy: Retain
      thinPoolConfig:
        name: {{ $storage.storageClassName }}-thin-pool
        sizePercent: {{ .Values.lvmCluster.thinPoolSizePercent }}
        overprovisionRatio: 1
