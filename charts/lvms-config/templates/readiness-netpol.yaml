# LVMS v5.0.0 ships a default-deny NetworkPolicy in openshift-storage with
# allow rules only for its own pods (lvms-operator, vg-manager). The readiness
# job needs the same egress the operator grants itself: OVN-K evaluates
# policy post-DNAT, so the API service (172.30.0.1:443) presents as the
# host-networked endpoint on port 6443, and OpenShift DNS listens on 5353.
# Mirrors lvms-operator-allow exactly.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: lvms-config-readiness-allow
  namespace: openshift-storage
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: lvms-config-readiness
  policyTypes:
  - Egress
  egress:
  - ports:
    - protocol: TCP
      port: 6443
  - ports:
    - protocol: TCP
      port: 5353
    - protocol: UDP
      port: 5353
    to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: openshift-dns
      podSelector:
        matchLabels:
          dns.operator.openshift.io/daemonset-dns: default
