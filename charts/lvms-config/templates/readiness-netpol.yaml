# LVMS v5.0.0 ships a default-deny NetworkPolicy in openshift-storage with
# allow rules only for its own pods (lvms-operator, vg-manager). The readiness
# job needs egress to the API server and DNS. OVN-K evaluates service traffic
# post-DNAT (the API endpoint is host-networked on the node IP), so the rule
# targets any destination but only ports 443/53 — proportionate for a
# short-lived readiness job with read-only RBAC.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: lvms-config-readiness-allow
  namespace: openshift-storage
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: lvms-config-readiness
  policyTypes:
  - Egress
  egress:
  - to:
    - ipBlock:
        cidr: 0.0.0.0/0
    ports:
    - protocol: TCP
      port: 443
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
