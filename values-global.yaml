global:
  pattern: minilab
  singleArgoCD: true
  storageProvider: lvm
  localStorage:
    capacityGiB: 100
    backingFilePath: /var/lib/minilab/lvms-loopback.img
    loopDevice: /dev/loop10
    storageClassName: lvms-loopback
    backingEfficiency: 85
    backingRoundingGiB: 4
    hostReserveGiB: 20
    defaultStorageClass:
      lvmClusterDefaultDeviceClass: true
  # Keep all OCP/LVMS release-coupled values together so subscriptions and
  # readiness checks cannot silently target different releases.
  lvmsCompatibility:
    ocpRelease: "4.22"
    channel: stable-4.22
    startingCSV: lvms-operator.v4.22.0
    cliImage: quay.io/openshift-release-dev/ocp-v4.0-art-dev@sha256:84b0aa6c19cdedba485212a5b599bdb9fd6975d5c808aaf4f115500b782ee600
    deployment: lvms-operator
    lvmClusterCRD: lvmclusters.lvm.topolvm.io
  secretsStore:
    backend: vault
  # OpenShell feature (specs/006-openshell-gitops-install): operator-owned public
  # zone hosted at Cloudflare and the Let's Encrypt account contact.
  # PLACEHOLDER values — replace before enabling; validate-schema asserts
  # openshell.gatewayHostname ends with this zone.
  dnsZone: tokyo-brunch.com
  acmeEmail: hostmaster@tokyo-brunch.com
  # Pattern-wide default repo for multi-source chart applications (VP community
  # charts: ocp-certmanager, ztwim, vault, external-secrets — coco-pattern model).
  # Per-app repoURL overrides (ghcr.io/nvidia, github.com git) take precedence.
  multiSourceRepoUrl: quay.io/validatedpatterns

main:
  clusterGroupName: prod
  # Release branch this pattern deploys from. operator-deploy otherwise
  # inherits the local checkout branch, silently re-pointing ArgoCD away from
  # main — pin it explicitly (feature 010 lesson).
  git:
    repoURL: https://github.com/butler54/minilab.git
    revision: main
  multiSourceConfig:
    enabled: true
    clusterGroupChartVersion: 0.9.*
  gitops:
    # Preserve live baseline; pattern-install CM keys map channel->gitops.channel,
    # operatorSource->gitops.catalogSource (verified against pattern-install 0.0.18).
    channel: gitops-1.21
    operatorSource: redhat-operators
    # Feature 010 (specs/010-reduce-cpu-usage): slow ArgoCD's full-reconciliation
    # cadence from the ~3m GitOps default to 600s to cut app-controller +
    # API-server churn on this 8-CPU SNO (research.md D3: default cadence costs
    # ~20 full reconcile passes/hour across ~11 Applications; 600s cuts that to
    # ~6/hour — a ~70% reduction in baseline GitOps churn — while the
    # concurrency·interval product stays far below the controller's 2-CPU limit,
    # so no queue starvation is expected).
    # Deep-merged into ArgoCD CR .spec by the patterns-operator via ConfigMap
    # patterns-operator-config key gitops.customArgoYaml.
    # Manual sync and webhooks still apply changes immediately; worst-case
    # staleness for unattended Git changes is 10m (adjustable via the spec's
    # tier ladder: 600s → 900s/1800s → 3600s).
    customArgoYaml: |
      extraConfig:
        timeout.reconciliation: 600s
