global:
  # OpenShell agent sandbox platform (see specs/006-openshell-gitops-install/).
  # Everything here is the operator-facing dial surface defined in
  # contracts/values-contract.md — chart pins and internal defaults are
  # deliberately NOT exposed.
  openshell:
    # Master switch. Keep false until G0 (vault seeds) and G1 (values review)
    # from quickstart.md are complete.
    enabled: true
    # Public gateway FQDN. MUST end with global.dnsZone. A DNS record pointing
    # this host at the cluster ingress is a documented operator step (runbook).
    # PLACEHOLDER — replace with the real hostname before enabling.
    gatewayHostname: openshell.tokyo-brunch.com
    # Which ACME endpoint the `acme` ClusterIssuer uses (must track the server
    # URL in overrides/values-certmanager.yaml). Prod per PR review of 006/007;
    # set staging only if ACME rate-limit churn requires it during bring-up.
    issuer: prod
    # SPIFFE trust domain for ZTWIM. Immutable after first reconcile.
    # Empty string = fall back to global.dnsZone.
    trustDomain: sno.tokyo-brunch.com
    # Concurrent sandbox capacity envelope; drives namespace ResourceQuota.
    sandbox:
      maxConcurrent: 3
    # Keycloak IdP for gateway OIDC (rh-keycloak app). DNS record for this FQDN
    # at the cluster ingress is a documented operator step (runbook).
    keycloak:
      hostname: keycloak.tokyo-brunch.com
    # Set enabled=false to skip SPIFFE identity components entirely (e.g. ZTWIM
    # operator unavailable on the cluster version — FR-011 fallback). ALSO
    # comment out the `ztwim` subscription+namespace and the `ztwim` application
    # in values-prod.yaml, and set spiffe.enabled=false in
    # overrides/values-openshell-gateway.yaml (drift-asserted).
    ztwim:
      enabled: true
    # Demonstration coding agent (FR-014). Requires OpenAI key seeded in vault.
    demo:
      enabled: false

# NOTE (refactor 007): upstream chart values moved to per-app override files —
# overrides/values-openshell-gateway.yaml (NVIDIA chart) plus values-ztwim.yaml,
# values-certmanager.yaml, values-agent-sandbox.yaml. The top-level `openshell:`
# passthrough block that fed the deleted wrapper chart is gone by design;
# tests/test-openshell-values.sh fails if it reappears.
