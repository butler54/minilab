apiVersion: openshell/v1alpha1
kind: ProviderProfile
metadata:
  name: zen
  description: >-
    OpenCode Zen free-tier models for the 011 demo. Keyless: the `*-free`
    models require NO credential, but only from a genuine opencode client —
    the relay validates client session identity (direct curl is rejected with
    403 FreeTierError; proven 2026-10-09, see
    specs/011-zen-sandbox-demo/demo-log.md G0/T004).
spec:
  # Import: openshell provider profile import deploy/openshell/profiles/zen.yaml --global
  # Create: openshell provider create --name zen --type zen --global-profile
  #   (no --credential: keyless per T004/T006 verdict)
  provider_type: zen
  endpoints:
    # host verified live: https://opencode.ai/zen/v1 (T005)
    - host: opencode.ai
      port: 443
      protocol: rest
      access: full
      enforcement: enforce
  binaries:
    - path: /usr/bin/curl
    - path: /usr/local/bin/curl
    - path: /usr/bin/node
    - path: /usr/lib/node_modules/opencode-ai/bin/opencode.exe
