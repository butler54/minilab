apiVersion: openshell/v1alpha1
kind: ProviderProfile
metadata:
  name: zen
  description: >-
    OpenCode Zen free-tier models for the 011 demo. Free `*-free` models;
    credential path decided by the 011 G0 spike (keyless if accepted, else a
    no-payment zen API key from opencode.ai/auth sourced from vault
    secret/data/hub/openshell-zen — never committed to Git).
spec:
  # Import: openshell provider profile import deploy/openshell/profiles/zen.yaml --global
  # Create: openshell provider create --name zen --type zen --global-profile \
  #           --credential ZEN_API_KEY   (only in key mode; see demo-log G0)
  provider_type: zen
  credentials:
    - name: api_key
      env: ZEN_API_KEY
      auth_style: bearer
  endpoints:
    # NOTE: resolved by G0 spike (spec-011 T005) — see specs/011-zen-sandbox-demo/demo-log.md
    - host: opencode.ai
      port: 443
      protocol: rest
      access: full
      enforcement: enforce
  binaries:
    - path: /usr/bin/curl
    - path: /usr/local/bin/curl
    - path: /usr/bin/node
    - path: /usr/lib/node_modules/opencode-ai/bin/opencode.exe
