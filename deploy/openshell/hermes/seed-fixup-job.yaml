# hermes-seed-fixup — one-shot root helper Job for the hermes workspace PVC.
#
# PURPOSE: the hermes image ships /opt/hermes-pristine with build-owned 0600
# files owned by uid 998, but the sandbox runtime runs the agent as uid
# 1000870000. hermes-seed (`cp -a` under `set -eu`) hits `Permission denied`,
# exits non-zero, and hermes-gateway-start (`set -euo pipefail`) kills the main
# process — the sandbox goes to phase Error ~2 min after Ready. This Job mounts
# the workspace PVC as root, re-runs the pristine copy with correct ownership
# (same semantics as hermes-seed: skip when .seeded exists, clear stale
# bytecode, write the .seeded marker).
#
# WHEN TO RUN: any fresh-PVC deploy (`deploy-hermes.sh gateway` / `create` on
# a new or recreated sandbox) until the containers-repo image fix lands
# (fix pristine-home ownership/permissions, branch 007-hermes-sandbox-layer).
# See docs/hermes-agent.md "Cluster re-measurement" and imperative row 7/8.
#
# This file is the committed form of the out-of-band root seed executed on
# 2026-11-23 (docs/hermes-agent.md, imperative steps — constitution II).
#
# USAGE (manual, one-shot):
#   1. The workspace PVC is RWO and the sandbox workload pod mounts it — stop
#      the sandbox first:  openshell sandbox stop -g minilab hermes
#      (or delete it if the point is to seed a fresh workspace)
#   2. Grant the root/privileged SCC to this Job's service account (one-time):
#        oc adm policy add-scc-to-user privileged -z hermes-seed-fixup -n openshell
#      (revoke after use: oc adm policy remove-scc-from-user privileged ...)
#   3. oc apply -f deploy/openshell/hermes/seed-fixup-job.yaml
#   4. oc -n openshell logs job/hermes-seed-fixup    # wait for completion
#   5. openshell sandbox start -g minilab hermes     # boots past the seed step
#   The Job self-deletes 24h after completion (ttlSecondsAfterFinished); if
#   that field is unsupported on your cluster, delete it manually:
#      oc -n openshell delete job hermes-seed-fixup
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hermes-seed-fixup
  namespace: openshell
  labels:
    app.kubernetes.io/name: hermes-seed-fixup
    app.kubernetes.io/part-of: hermes-agent
---
apiVersion: batch/v1
kind: Job
metadata:
  name: hermes-seed-fixup
  namespace: openshell
  labels:
    app.kubernetes.io/name: hermes-seed-fixup
    app.kubernetes.io/part-of: hermes-agent
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hermes-seed-fixup
        app.kubernetes.io/part-of: hermes-agent
    spec:
      restartPolicy: Never
      serviceAccountName: hermes-seed-fixup
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: seed-fixup
          # Same image pinned in the hermes AgentSandbox definition (S4 seed
          # layout publish, PR #67).
          image: ghcr.io/butler54/openshell-sandbox-hermes@sha256:ba3908eb23e128e5b2eaf38390d792ed7c5db4773fea22dc09fc205de5fdde10
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              if [ -f /sandbox/.hermes/.seeded ]; then
                echo "seed-fixup: /sandbox/.hermes/.seeded present — already seeded, nothing to do"
                ls -ld /sandbox/.hermes
                exit 0
              fi
              echo "seed-fixup: copying /opt/hermes-pristine -> /sandbox/.hermes root-relative"
              mkdir -p /sandbox/.hermes
              cp -a /opt/hermes-pristine/. /sandbox/.hermes/
              # Bytecode built by the image's build python is invalid for the
              # sandbox runtime python (hermes-seed clears it too).
              find /sandbox/.hermes -type d -name __pycache__ -prune -exec rm -rf {} + || true
              chown -R 1000870000:1000870000 /sandbox/.hermes
              files=$(find /sandbox/.hermes -type f | wc -l)
              touch /sandbox/.hermes/.seeded
              chown 1000870000:1000870000 /sandbox/.hermes/.seeded
              echo "seed-fixup: seeded ${files} files; owner now $(stat -c '%u:%g' /sandbox/.hermes)"
          securityContext:
            # One-shot manual helper: needs root + chown across the workspace
            # tree. Requires the privileged SCC grant in step 2 above.
            privileged: true
            runAsUser: 0
            allowPrivilegeEscalation: true
          volumeMounts:
            - name: workspace
              mountPath: /sandbox
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: workspace-default--hermes
