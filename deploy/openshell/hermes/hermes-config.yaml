# Hermes Agent config.yaml — source of truth for the hermes sandbox
# (docs/hermes-agent.md). Applied at sandbox creation by
# deploy/openshell/hermes/deploy-hermes.sh via `hermes config set` (hermes'
# own config system): direct config.yaml writes are reverted by the gateway's
# home maintenance (2026-11-23 finding).
#
# Model: self-hosted qwen on donnager-linux, reached by direct LAN IP
# (no tailscale route from the cluster). Model id and endpoint verified live
# in Gate 0 (docs/hermes-agent.md): Ollama 0.34.2 reports qwen-coder:latest.
# (Gate 0 evidence was local-gateway — see topology correction in docs/hermes-agent.md; re-verified on cluster 2026-11-20)
# The apiKey is Ollama's conventional dummy ("ollama") — not a secret; real
# secrets (Slack tokens, Signal account) live in Vault and are injected via
# the .env template, never in this file.
model:
  default: qwen-coder:latest
  provider: custom
  base_url: http://192.168.4.190:11434/v1
  api_key: ollama
